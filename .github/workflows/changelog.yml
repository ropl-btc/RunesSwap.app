name: Changelog Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changelog entry or a versioned release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show "${BASE_SHA}:package.json" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$VERSION" != "$BASE_VERSION" ]; then
            node -e '
              const [next, base] = process.argv.slice(1).map(v => v.split(".").map(Number));
              const difference = next.map((part, i) => part - base[i]).find(part => part !== 0);
              if (!(difference > 0)) process.exit(1);
            ' "$VERSION" "$BASE_VERSION"
            FIRST_RELEASE=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md)
            if [[ "$FIRST_RELEASE" != "## [$VERSION] - "* ]]; then
              echo "The latest dated release must match package.json." >&2
              exit 1
            fi
            if git show "${BASE_SHA}:CHANGELOG.md" | grep -Fq "## [$VERSION]"; then
              echo "The release version already exists in the base changelog." >&2
              exit 1
            fi
            exit 0
          fi

          extract_unreleased() {
            awk '
              /^## \[Unreleased\]$/ { in_unreleased = 1; next }
              in_unreleased && /^## \[/ { exit }
              in_unreleased && /^- / { print }
            '
          }

          git show "${BASE_SHA}:CHANGELOG.md" | extract_unreleased | sort > "${RUNNER_TEMP}/base-unreleased"
          extract_unreleased < CHANGELOG.md | sort > "${RUNNER_TEMP}/head-unreleased"
          comm -13 "${RUNNER_TEMP}/base-unreleased" "${RUNNER_TEMP}/head-unreleased" | grep -qE '^- '

name: PR CI

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun ci
      - name: Type Check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Architecture Lint
        run: bun run lint:architecture
      - name: Test
        run: bun run test

name: Release from Changelog

on:
  check_run:
    types: [completed]

permissions:
  contents: write

jobs:
  changelog_release:
    if: >-
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: runesswap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.check_run.head_sha }}
          persist-credentials: false

      - name: Verify deployed commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Extract latest version and notes
        id: extract
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md || true)
          if [ -z "${VERSION_LINE}" ]; then
            echo "No version section found; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "Release v${VERSION} already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -v heading="$VERSION_LINE" '
            $0 == heading {found=1; next}
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if ! grep -qE '^- [[:space:]]*[^[:space:]]' RELEASE_NOTES.md; then
            echo "No notes captured for $VERSION; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Verify package.json version matches
        if: steps.extract.outputs.skip != 'true'
        id: verify
        run: |
          set -euo pipefail
          FILE_VERSION="${{ steps.extract.outputs.version }}"
          PKG_VERSION=$(node -pe "require('./package.json').version")
          echo "CHANGELOG version: $FILE_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$FILE_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: CHANGELOG ($FILE_VERSION) != package.json ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        if: steps.extract.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract.outputs.version }}
          DEPLOYED_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="RunesSwap.app v${VERSION}"
          # Create or update the release; creating a release will also create the tag at this commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --latest -F RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TITLE" --latest -F RELEASE_NOTES.md --target "${DEPLOYED_SHA}"
          fi
